name: wavebox

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: wavebox-dev
      POSTGRES_USER: wavebox
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wavebox -d wavebox-dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./tracks:/app/tracks:ro
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://wavebox:${POSTGRES_PASSWORD}@db:5432/wavebox-dev
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  migrations:
    build: ./python-backend
    environment:
      DATABASE_URL: postgresql+psycopg://wavebox:${POSTGRES_PASSWORD}@db:5432/wavebox-dev
    depends_on:
      db:
        condition: service_healthy

  importer:
    profiles: ["tools"]
    build: ./python-backend
    command: ["python", "import_tracks.py"]
    environment:
      DATABASE_URL: postgresql+psycopg://wavebox:${POSTGRES_PASSWORD}@db:5432/wavebox-dev
    volumes:
      - ./tracks:/app/tracks
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully

  auth:
    build:
      context: .
      dockerfile: auth/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: wavebox-dev
      DB_USER: wavebox
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DATABASE_URL: postgresql+psycopg://wavebox:${POSTGRES_PASSWORD}@db:5432/wavebox-dev
      MUSIC_BACKEND_PATH: /python-backend
      MUSIC_AUDIO_DIR: /app/tracks/audio
      MUSIC_COVERS_DIR: /app/tracks/covers
      MAX_MUSIC_UPLOAD_SIZE: ${MAX_MUSIC_UPLOAD_SIZE:-104857600}
    volumes:
      - ./tracks:/app/tracks
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    command: >
      sh -c "python manage.py migrate &&
              python manage.py runserver 0.0.0.0:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

volumes:
  postgres_data:
  frontend_node_modules:
